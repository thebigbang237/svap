name: Payments reconciliation cron

# Quarter-hourly driver for payment reconciliation, running on GitHub Actions
# rather than Vercel Cron — same reason as access-codes-cron.yml.
#
# Why: Vercel's Hobby plan caps cron jobs at once per day, and a deployment
# containing a more frequent expression is REJECTED outright ("Hobby accounts
# are limited to daily cron jobs"). A daily reconciliation would mean a
# candidate who approves the mobile-money PIN prompt and then closes the tab
# waits up to 24 hours before their dossier advances and their receipt
# arrives — having already paid. On mobile data across these six markets,
# closing the tab mid-payment is ordinary behaviour, not an edge case.
#
# The Vercel cron in vercel.json stays as a daily safety net: if this workflow
# is disabled or unconfigured, payments still reconcile, just slowly.
#
# ⚠️ GitHub disables scheduled workflows in repositories with no activity for
# 60 days, and delays schedules under platform load. Neither is fatal — the
# job is idempotent and a late run simply catches up — but it is the reason
# the Vercel daily cron is kept as a backstop rather than removed.
#
# ---------------------------------------------------------------------------
# Required repository secrets (Settings → Secrets and variables → Actions)
#   SITE_URL     https://svap-zeta.vercel.app   (later the production domain)
#   CRON_SECRET  the same value as the Vercel environment variable
# Until both are set this workflow SKIPS with a warning rather than failing —
# an unconfigured schedule is a setup state, not an incident.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: "*/15 * * * *"
  # Lets you fire a run by hand from the Actions tab — the quickest way to
  # unstick a specific payment without waiting for the schedule.
  workflow_dispatch:

# Never let two runs overlap. The job is idempotent, but concurrent runs would
# race each other over the same batch of pending payments and waste provider
# status calls.
concurrency:
  group: payments-cron
  cancel-in-progress: false

jobs:
  invoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: config
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${SITE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cron not configured::SITE_URL and CRON_SECRET are not set as repository secrets, so payments are not being reconciled every 15 minutes. Vercel's daily cron in vercel.json is still running as a fallback. See docs/runbook.md §3."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger payment reconciliation
        if: steps.config.outputs.configured == 'true'
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          # --fail-with-body so a non-2xx exits non-zero AND prints the body.
          # A 404 means CRON_SECRET doesn't match the deployment — the endpoint
          # hides itself from unauthenticated callers, so without this check a
          # wrong secret would look like a silent success while every settled
          # payment sat unreconciled.
          response=$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Length: 0" \
            "${SITE_URL%/}/api/cron/payments")

          echo "Response: ${response}"
